# Render's free plan puts the API to sleep after ~15 minutes without traffic, and the
# next visitor waits ~50 s for it to wake up. Pinging /health every few minutes keeps it up.
# GitHub may delay scheduled runs, so a long gap can still let it sleep now and then.
name: Keep API awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-api-awake
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the API
        run: curl --fail --silent --show-error --max-time 90 --retry 3 --retry-delay 10 --retry-all-errors https://nutri-ai-api.onrender.com/health
